<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* 头部标题区域 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #a0a0b0;
            font-size: 1rem;
        }

        /* 游戏卡片网格布局 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1100px;
        }

        /* 单个游戏卡片样式 */
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        /* 鼠标悬停效果 */
        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.1);
            border-color: #3a7bd5;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        /* 游戏图标占位 */
        .game-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.08);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
        }

        /* 游戏标题 */
        .game-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        /* 游戏简介 */
        .game-desc {
            font-size: 0.9rem;
            color: #b0b0c0;
            line-height: 1.4;
        }

        /* 底部版权 */
        footer {
            margin-top: auto;
            padding-top: 40px;
            color: #606070;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 休闲游戏导航</h1>
        <p>点击下方任意游戏卡片，即可在新标签页中直接开始游玩</p>
    </header>

    <main class="game-grid">
        <!-- 游戏 1 -->
        <a href="/hyqs" target="_blank" rel="noopener noreferrer" class="game-card">
            <div class="game-icon">🔢</div>
            <div class="game-title">华山论剑</div>
            <div class="game-desc">剑在手问天下谁是英雄！</div>
        </a>

        <!-- 游戏 2 -->
        <a href="/tcs" target="_blank" rel="noopener noreferrer" class="game-card">
            <div class="game-icon">🦖</div>
            <div class="game-title">贪吃蛇</div>
            <div class="game-desc">决战南宁版本10关大战</div>
        </a>

        <!-- 游戏 3 -->
        <a href="/concat" target="_blank" rel="noopener noreferrer" class="game-card">
            <div class="game-icon">🐍</div>
            <div class="game-title">concat剪影</div>
            <div class="game-desc">多人在线贪吃蛇大作战，吞噬光点变长，击败对手。</div>
        </a>

        <!-- 游戏 4 -->
        <a href="https://tetr.io/" target="_blank" rel="noopener noreferrer" class="game-card">
            <div class="game-icon">🧱</div>
            <div class="game-title">TETR.IO 俄罗斯方块</div>
            <div class="game-desc">现代快节奏在线俄罗斯方块，支持单人练习与多人对战。</div>
        </a>

        <!-- 游戏 5 -->
        <a href="https://skribbl.io/" target="_blank" rel="noopener noreferrer" class="game-card">
            <div class="game-icon">🎨</div>
            <div class="game-title">你画我猜 (Skribbl)</div>
            <div class="game-desc">支持与好友创建房间联机的经典灵魂画手猜词游戏。</div>
        </a>

        <!-- 游戏 6 (自定义模板) -->
        <a href="https://www.yikm.net/" target="_blank" rel="noopener noreferrer" class="game-card">
            <div class="game-icon">🕹️</div>
            <div class="game-title">小霸王其乐无穷</div>
            <div class="game-desc">在线怀旧红白机（FC）游戏合集，重温童年经典。</div>
        </a>
    </main>

    <footer>
        <p>© 我的游戏导航站 | 自制小游戏</p>
    </footer>

</body>
</html>
