
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>笑傲江湖：剑心劫 - 会员版</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1c1c21;
            --border-color: #383530;
            --text-main: #d8d3c8;
            --text-dim: #8a8478;
            --accent-gold: #c89d54;
            --accent-red: #b83b3b;
            --accent-green: #4a8c5e;
            --accent-blue: #4a769e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "SimSun", serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* 登录遮罩层 */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-box {
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            padding: 25px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .auth-box h2 { color: var(--accent-gold); margin-bottom: 15px; letter-spacing: 2px; }
        .auth-box input {
            width: 100%;
            background: #121214;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .auth-box input:focus { border-color: var(--accent-gold); }
        .auth-btns { display: flex; gap: 10px; margin-top: 10px; }
        .auth-btns button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn-login { background: var(--accent-gold); color: #121214; }
        .btn-reg { background: #33333d; color: var(--text-main); border: 1px solid var(--border-color) !important; }
        .auth-msg { color: var(--accent-red); font-size: 0.8rem; margin-top: 8px; height: 18px; }

        /* 顶部状态栏 */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            z-index: 10;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar h1 {
            font-size: 1rem;
            color: var(--accent-gold);
        }

        .sys-btns { display: flex; gap: 4px; }
        .sys-btns button {
            background: #2a2a30;
            color: var(--text-dim);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 0.75rem;
            background: #141417;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #282622;
        }

        .stat-item span { color: var(--accent-gold); font-weight: bold; }
        .stat-hp span { color: var(--accent-red); }
        .stat-mp span { color: var(--accent-blue); }

        #game-log {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            line-height: 1.75;
            font-size: 0.95rem;
            scroll-behavior: smooth;
        }

        .msg { margin-bottom: 14px; animation: fadeIn 0.3s ease; }
        .msg-system { color: var(--accent-gold); font-weight: bold; border-left: 3px solid var(--accent-gold); padding-left: 10px; }
        .msg-story { color: var(--text-main); text-indent: 2em; }
        .msg-combat { color: #e06c75; }
        .msg-reward { color: var(--accent-green); font-weight: bold; }
        .msg-user { color: var(--text-dim); font-size: 0.85rem; text-align: right; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        #quick-actions {
            background: #17171b;
            border-top: 1px solid var(--border-color);
            padding: 10px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 20;
        }

        .action-chip {
            background: #252429;
            color: var(--accent-gold);
            border: 1px solid #4a4235;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .action-chip:active, .action-chip:hover { background: var(--accent-gold); color: #121214; }

        #input-area {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        #cmd-input {
            flex: 1;
            background: #121214;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        #send-btn {
            background: var(--accent-gold); color: #121214; border: none; padding: 0 18px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--panel-bg); border: 1px solid var(--accent-gold); border-radius: 8px; padding: 20px; max-width: 450px; width: 100%; line-height: 1.6;
        }
        .modal-content h3 { color: var(--accent-gold); margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .close-modal { margin-top: 15px; width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<!-- 会员登录注册弹窗 -->
<div id="auth-modal">
    <div class="auth-box">
        <h2>⚔️ 笑傲江湖·江湖令</h2>
        <input type="text" id="username" placeholder="请输入江湖侠名（用户名）" autocomplete="off">
        <input type="password" id="password" placeholder="请输入通行密令（密码）">
        <div class="auth-msg" id="auth-msg"></div>
        <div class="auth-btns">
            <button class="btn-reg" onclick="handleRegister()">注册账号</button>
            <button class="btn-login" onclick="handleLogin()">登入江湖</button>
        </div>
    </div>
</div>

<header>
    <div class="title-bar">
        <h1 id="user-title">⚔️ 侠客：未登录</h1>
        <div class="sys-btns">
            <button id="music-btn" onclick="toggleBGM()">🎵 音乐:关</button>
            <button onclick="logout()">注销</button>
            <button onclick="showStatus()">档案</button>
            <button onclick="manualSave()">手动存档</button>
        </div>
    </div>
    <div class="stats-grid">
        <div class="stat-item stat-hp">气血: <span id="ui-hp">100/100</span></div>
        <div class="stat-item stat-mp">内力: <span id="ui-mp">50/50</span></div>
        <div class="stat-item">剑法: <span id="ui-atk">10</span></div>
        <div class="stat-item">身法: <span id="ui-agi">10</span></div>
        <div class="stat-item">境界: <span id="ui-realm">初出茅庐</span></div>
        <div class="stat-item">银两: <span id="ui-gold">20</span></div>
        <div class="stat-item">声望: <span id="ui-fame">0</span></div>
        <div class="stat-item">心性: <span id="ui-align">中立</span></div>
    </div>
</header>

<div id="game-log"></div>
<div id="quick-actions"></div>

<div id="input-area">
    <input type="text" id="cmd-input" placeholder="输入指令或点击上方按钮..." autocomplete="off">
    <button id="send-btn" onclick="handleInput()">行令</button>
</div>

<div id="modal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-content" id="modal-body"></div>
</div>

<script>
    /* ================= 8-Bit 音乐引擎 ================= */
    let audioCtx = null, bgmInterval = null, isBgmPlaying = false;
    const xiaoaoNotes = [
        392.00, 523.25, 587.33, 659.25, 587.33, 523.25, 392.00, 0,
        392.00, 523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 0,
        659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 523.25, 392.00,
        293.66, 392.00, 523.25, 587.33, 523.25, 392.00, 329.63, 0
    ];
    let noteIndex = 0;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playChiptuneNote(freq) {
        if (!audioCtx || !isBgmPlaying || freq === 0) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } catch(e) {}
    }

    function toggleBGM() {
        initAudio();
        isBgmPlaying = !isBgmPlaying;
        const btn = document.getElementById('music-btn');
        if (isBgmPlaying) {
            btn.innerText = "🎵 音乐:开";
            if (!bgmInterval) {
                bgmInterval = setInterval(() => {
                    if (isBgmPlaying) {
                        playChiptuneNote(xiaoaoNotes[noteIndex]);
                        noteIndex = (noteIndex + 1) % xiaoaoNotes.length;
                    }
                }, 220);
            }
        } else { btn.innerText = "🎵 音乐:关"; }
    }

    /* ================= 会员系统逻辑 ================= */
    let currentUser = null;
    let state = getDefaultState();

    function getDefaultState() {
        return {
            name: "少侠", sect: "无门无派",
            hp: 100, maxHp: 100, mp: 50, maxMp: 50,
            atk: 12, agi: 10, gold: 20, fame: 0, karma: 0,
            day: 1, scene: "intro",
            skills: ["基础剑法"], items: ["金创药"], flags: {}, enemy: null
        };
    }

    // 注册账号
    function handleRegister() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const msg = document.getElementById('auth-msg');

        if (!u || !p) { msg.innerText = "侠名与密令不能为空！"; return; }
        
        let users = JSON.parse(localStorage.getItem('xiaoao_users') || '{}');
        if (users[u]) {
            msg.innerText = "此侠名已被占用，请更换！";
            return;
        }

        // 注册新用户并初始化初始存档
        users[u] = { password: p, save: getDefaultState() };
        localStorage.setItem('xiaoao_users', JSON.stringify(users));
        
        msg.style.color = "var(--accent-green)";
        msg.innerText = "注册成功！请点击登入江湖。";
    }

    // 登录账号
    function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const msg = document.getElementById('auth-msg');

        if (!u || !p) { msg.innerText = "请输入侠名与密令！"; return; }

        let users = JSON.parse(localStorage.getItem('xiaoao_users') || '{}');
        if (!users[u]) {
            msg.innerText = "此侠名不存在，请先注册！";
            return;
        }
        if (users[u].password !== p) {
            msg.innerText = "密令（密码）错误！";
            return;
        }

        // 登录成功
        currentUser = u;
        state = users[u].save;
        document.getElementById('user-title').innerText = `⚔️ 侠客：${u}`;
        document.getElementById('auth-modal').style.display = 'none';

        initAudio(); // 允许音频
        logEl.innerHTML = '';
        if (state.enemy) startCombat(state.enemy);
        else goScene(state.scene);
    }

    // 注销/切换账号
    function logout() {
        autoSave();
        currentUser = null;
        document.getElementById('auth-modal').style.display = 'flex';
        document.getElementById('password').value = '';
        document.getElementById('auth-msg').innerText = "已安全登出江湖。";
    }

    // 自动存档（每次进入新剧情或战斗结束时触发）
    function autoSave() {
        if (!currentUser) return;
        let users = JSON.parse(localStorage.getItem('xiaoao_users') || '{}');
        if (users[currentUser]) {
            users[currentUser].save = state;
            localStorage.setItem('xiaoao_users', JSON.stringify(users));
        }
    }

    function manualSave() {
        autoSave();
        print("【系统】当前账号进度已成功保存至服务器/本地凭证！", "system");
    }

    /* ================= 游戏主剧情与战斗逻辑 ================= */
    const logEl = document.getElementById('game-log');
    const actionsEl = document.getElementById('quick-actions');
    const inputEl = document.getElementById('cmd-input');

    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleInput(); });

    function print(text, type = 'story') {
        const div = document.createElement('div');
        div.className = `msg msg-${type}`;
        div.innerHTML = text;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function updateUI() {
        document.getElementById('ui-hp').innerText = `${state.hp}/${state.maxHp}`;
        document.getElementById('ui-mp').innerText = `${state.mp}/${state.maxMp}`;
        document.getElementById('ui-atk').innerText = state.atk;
        document.getElementById('ui-agi').innerText = state.agi;
        document.getElementById('ui-gold').innerText = state.gold;
        document.getElementById('ui-fame').innerText = state.fame;

        let power = state.atk + state.agi + Math.floor(state.maxMp / 5);
        let realm = "初出茅庐";
        if (power > 180) realm = "一代宗师";
        else if (power > 120) realm = "名震江湖";
        else if (power > 75) realm = "登堂入室";
        else if (power > 40) realm = "小有所成";
        document.getElementById('ui-realm').innerText = realm;

        let align = "亦正亦邪";
        if (state.karma >= 30) align = "侠义无双";
        else if (state.karma >= 10) align = "名门正派";
        else if (state.karma <= -30) align = "魔道巨擘";
        else if (state.karma <= -10) align = "心狠手辣";
        document.getElementById('ui-align').innerText = align;
        autoSave(); // 实时更迭自动存档
    }

    const SCENES = {
        intro: {
            enter: () => {
                print("【序章：风雨欲来】", "system");
                print("明末乱世，江湖暗流涌动。日月神教虎视眈眈，一卷《辟邪剑谱》将福建福威镖局推向灭顶之灾。");
                print("你行至福州城外破庙避雨，听见外面传来兵刃交击声。青城派正围攻一名身负重伤的福威镖局镖头。");
            },
            options: [
                { text: "1. 拔剑相助，击退青城派", cmd: "1", action: () => {
                    state.karma += 10; state.fame += 5;
                    print("你大喝一声破门而出，虽武艺尚浅却逼退了青城派。镖头临终前将《辟邪剑法(残篇)》托付于你！", "story");
                    learnSkill("辟邪剑法(残篇)"); goScene("choose_sect");
                }},
                { text: "2. 暗中观察，坐收渔利", cmd: "2", action: () => {
                    state.karma -= 10; state.gold += 20;
                    print("镖头与青城弟子同归于尽。你搜刮了残缺剑谱与二十两银子。", "story");
                    learnSkill("辟邪剑法(残篇)"); goScene("choose_sect");
                }},
                { text: "3. 悄然离开，事不关己", cmd: "3", action: () => {
                    print("你趁着夜色离开破庙，一路北上。", "story");
                    state.agi += 3; goScene("choose_sect");
                }}
            ]
        },
        choose_sect: {
            enter: () => {
                print("【第一章：拜入山门】", "system");
                print("你来到中原，决定寻找安身立命之所：");
            },
            options: [
                { text: "1. 拜入华山派（气宗正统）", cmd: "1", action: () => {
                    state.sect = "华山派"; state.maxMp += 40; state.mp += 40; state.karma += 5;
                    learnSkill("华山基础剑法"); goScene("huashan_hub");
                }},
                { text: "2. 投奔衡山派（快剑音律）", cmd: "2", action: () => {
                    state.sect = "衡山派"; state.agi += 8; state.atk += 4;
                    learnSkill("百变千幻云雾十三式"); goScene("huashan_hub");
                }},
                { text: "3. 潜入日月神教（魔教秘法）", cmd: "3", action: () => {
                    state.sect = "日月神教"; state.atk += 8; state.karma -= 10;
                    learnSkill("黑血神针"); goScene("huashan_hub");
                }}
            ]
        },
        huashan_hub: {
            enter: () => {
                print(`【江湖日常 · 第 ${state.day} 天】（当前侠客：${currentUser} | 门派：${state.sect}）`, "system");
                print("嵩山派正密谋五岳并派，思过崖藏有秘密。你可以自由进行修炼或下山：");
            },
            options: [
                { text: "1. 演武场练剑（提升攻击）", cmd: "练剑", action: () => doTrain("sword") },
                { text: "2. 静室打坐（提升内力）", cmd: "打坐", action: () => doTrain("meditate") },
                { text: "3. 探索华山思过崖", cmd: "思过崖", action: () => goScene("siguoya") },
                { text: "4. 下山历练与战斗", cmd: "下山", action: () => goScene("jianghu_event") },
                { text: "5. 前往金盆洗手大会（需剑法+身法>=35）", cmd: "金盆洗手", action: () => {
                    if (state.atk + state.agi < 35) {
                        print("【提示】武功尚浅，贸然前往恐有危险，建议先修炼几日！", "combat");
                        renderActions(SCENES.huashan_hub.options);
                    } else { goScene("liuzhengfeng"); }
                }}
            ]
        },
        siguoya: {
            enter: () => {
                print("【奇遇：思过崖石壁】", "system");
                if (state.flags.siguoyaDone) { print("思过崖石壁你已参悟透彻。"); }
                else { print("你在洞内发现了破招石壁，风清扬前辈向你走来……"); }
            },
            options: [
                { text: "1. 请教风清扬前辈", cmd: "1", action: () => {
                    if (state.flags.siguoyaDone) { goScene("huashan_hub"); return; }
                    if (state.karma >= 0) {
                        print("风清扬大笑：“传你独孤九剑真谛！”", "dialogue");
                        learnSkill("独孤九剑(总诀式)"); state.atk += 18; state.agi += 12; state.flags.siguoyaDone = true;
                    } else { print("风清扬冷哼：“戾气太重，滚吧！”", "combat"); state.hp = Math.max(10, state.hp - 20); }
                    updateUI(); goScene("huashan_hub");
                }},
                { text: "2. 强记魔教破招之法", cmd: "2", action: () => {
                    if (!state.flags.siguoyaDone) {
                        state.atk += 15; state.hp = Math.max(10, state.hp - 30); state.karma -= 5; state.flags.siguoyaDone = true;
                        print("你强行记住诡异招式，走火入魔吐血，但攻击大增！", "story"); updateUI();
                    }
                    goScene("huashan_hub");
                }},
                { text: "3. 返回驻地", cmd: "3", action: () => goScene("huashan_hub") }
            ]
        },
        jianghu_event: {
            enter: () => {
                print("【江湖历练】", "system");
                let roll = Math.random();
                if (roll < 0.45) {
                    startCombat({ name: "万里独行·田伯光", hp: 90, maxHp: 90, atk: 16, agi: 18, rewardGold: 30, rewardFame: 15, desc: "田伯光正纠缠恒山派小尼姑仪琳！" });
                } else if (roll < 0.8) {
                    startCombat({ name: "嵩山十三太保·费彬", hp: 120, maxHp: 120, atk: 20, agi: 14, rewardGold: 50, rewardFame: 25, desc: "费彬带人截住你，狞笑逼问秘密！" });
                } else {
                    print("你偶遇琴师谈论音律，获赠【九花玉露丸】与二十两银子。", "reward");
                    state.gold += 20; state.items.push("九花玉露丸"); state.day++;
                    updateUI(); renderActions([{ text: "返回门派", cmd: "返回", action: () => goScene("huashan_hub") }]);
                }
            },
            options: []
        },
        liuzhengfeng: {
            enter: () => {
                print("【第二章：衡山城·金盆洗手】", "system");
                print("嵩山派费彬逼迫刘正风与魔教曲洋自相残杀。局势一触即发！");
            },
            options: [
                { text: "1. 拔剑突围，护送刘曲二人", cmd: "1", action: () => {
                    state.karma += 20; state.fame += 30; state.maxMp += 60; state.mp = state.maxMp; state.flags.gotMusic = true;
                    print("你挡在身前，刘曲二人将《笑傲江湖曲》托付给你，内力大增。", "reward"); goScene("chapter3_xixing");
                }},
                { text: "2. 助嵩山派灭魔教妖人", cmd: "2", action: () => {
                    state.karma -= 20; state.fame += 20; learnSkill("寒冰真气"); state.atk += 20;
                    print("左冷禅大喜，赐你《寒冰真气》残卷！", "reward"); goScene("chapter3_xixing");
                }},
                { text: "3. 潜入后院搜刮秘宝", cmd: "3", action: () => {
                    state.karma -= 10; state.gold += 100; state.items.push("九花玉露丸");
                    print("你趁乱洗劫了书房百两黄金与灵丹妙药。", "reward"); goScene("chapter3_xixing");
                }}
            ]
        },
        chapter3_xixing: {
            enter: () => {
                print("【第三章：梅庄地牢】", "system");
                print("西湖梅庄地牢深处，你遭遇任我行。脚下刻着《吸星大法》，怀中辟邪剑谱发烫……");
            },
            options: [
                { text: "1. 逆转经脉，强修吸星大法", cmd: "1", action: () => {
                    learnSkill("吸星大法"); state.maxMp += 150; state.mp = state.maxMp; state.atk += 25; state.karma -= 15;
                    print("你与任我行内力对流，吸得数十年精纯内力！", "reward"); goScene("finale_prelude");
                }},
                { text: "2. 斩断铁链，助任我行脱困", cmd: "2", action: () => {
                    state.fame += 40; state.atk += 20;
                    print("任我行脱困狂笑：“黑木崖少教主之位给你留着！”", "dialogue"); goScene("finale_prelude");
                }},
                { text: "3. 挥剑自宫，修炼完整《辟邪剑法》", cmd: "自宫", action: () => {
                    if (!state.skills.includes("辟邪剑法(残篇)")) {
                        print("你没有辟邪剑谱残篇，无法修炼！", "combat");
                        renderActions(SCENES.chapter3_xixing.options); return;
                    }
                    learnSkill("辟邪剑法(大成)"); state.atk += 55; state.agi += 60; state.karma -= 30; state.flags.bixieMax = true;
                    print("‘欲练此功，必先自宫！’身法剑速暴增至鬼魅之境！", "combat"); updateUI(); goScene("finale_prelude");
                }}
            ]
        },
        finale_prelude: {
            enter: () => {
                print("【终章：黑木崖决战】", "system");
                print("成德殿内，东方不败一袭红衣，绣花针逼绝群雄。她冷冷看向你：“你也想来送死么？”");
            },
            options: [
                { text: "1. 决战东方不败！", cmd: "1", action: () => {
                    startCombat({ name: "天下第一·东方不败", hp: 260, maxHp: 260, atk: 42, agi: 45, isFinalBoss: true, desc: "东方不败身形化作红影，绣花针直刺眉心！" });
                }}
            ]
        }
    };

    function doTrain(type) {
        state.day++;
        if (type === "sword") {
            if (state.hp <= 20) { print("气血不足，请先休整！", "combat"); }
            else {
                let gain = 4 + Math.floor(Math.random() * 4);
                state.atk += gain; state.hp -= 15;
                print(`刻苦练剑，【剑法】+${gain} （气血 -15）`, "reward");
            }
        } else if (type === "meditate") {
            let mpGain = 10 + Math.floor(Math.random() * 6);
            state.maxMp += mpGain; state.mp = state.maxMp;
            state.hp = Math.min(state.maxHp, state.hp + 35);
            print(`打坐吐纳，【内力上限】+${mpGain}，气血恢复。`, "reward");
        }
        updateUI(); renderActions(SCENES.huashan_hub.options);
    }

    function learnSkill(name) {
        if (!state.skills.includes(name)) { state.skills.push(name); print(`【习得绝学】《${name}》！`, "reward"); }
    }

    function startCombat(enemy) {
        state.enemy = enemy;
        print(`⚔️ 【遭遇强敌：${enemy.name}】`, "combat");
        print(enemy.desc, "story");
        renderCombatActions();
    }

    function renderCombatActions() {
        let opts = [
            { text: "1. 普通剑招攻击", cmd: "攻击", action: () => combatTurn("normal") },
            { text: "2. 绝学暴击（消耗20内力）", cmd: "绝学", action: () => combatTurn("skill") },
            { text: "3. 服用丹药", cmd: "吃药", action: () => combatTurn("heal") }
        ];
        if (!state.enemy.isFinalBoss) opts.push({ text: "4. 轻功撤退", cmd: "逃跑", action: () => combatTurn("flee") });
        renderActions(opts);
    }

    function combatTurn(move) {
        let e = state.enemy;
        if (!e) return;
        if (move === "heal") {
            if (state.items.length > 0) {
                state.items.pop(); state.hp = Math.min(state.maxHp, state.hp + 100);
                print("服下丹药，气血大涨！", "reward");
            } else { print("行囊中没有丹药了！", "combat"); }
        } else if (move === "flee") {
            if (state.agi >= e.agi || Math.random() > 0.4) {
                print("你成功施展轻功逃脱！", "story");
                state.enemy = null; updateUI(); goScene("huashan_hub"); return;
            } else { print("退路被封，无法逃跑！", "combat"); }
        } else {
            let dmg = Math.max(5, state.atk + Math.floor(Math.random() * 8) - Math.floor(e.agi / 3));
            if (move === "skill") {
                if (state.mp >= 20) { state.mp -= 20; dmg = Math.floor(dmg * 2.1); print(`绝学爆发！造成 ${dmg} 点暴击伤害！`, "combat"); }
                else { print("内力不足！", "combat"); }
            } else { print(`一剑刺中，造成 ${dmg} 点伤害。`, "combat"); }
            e.hp -= dmg;
        }

        if (e.hp <= 0) {
            print(`🎉 击败【${e.name}】！`, "reward");
            if (e.isFinalBoss) { triggerEnding(); return; }
            state.gold += e.rewardGold || 20; state.fame += e.rewardFame || 10; state.day++;
            state.enemy = null; updateUI();
            renderActions([{ text: "返回门派休整", cmd: "返回", action: () => goScene("huashan_hub") }]); return;
        }

        let eDmg = Math.max(4, e.atk + Math.floor(Math.random() * 6) - Math.floor(state.agi / 3));
        state.hp -= eDmg;
        print(`${e.name} 反击，你气血 -${eDmg} （敌血：${e.hp}）`, "combat");

        if (state.hp <= 0) {
            state.hp = 0; updateUI();
            print("【胜败兵家常事】你重伤倒地，江湖路尽……", "system");
            renderActions([{ text: "重新开始", cmd: "重开", action: () => resetGame() }]); return;
        }
        updateUI(); renderCombatActions();
    }

    function triggerEnding() {
        print("====================================", "system");
        print("【大结局：笑傲江湖】", "system");
        if (state.flags.bixieMax) print("【隐藏结局：东方再世·孤独魔神】");
        else if (state.flags.gotMusic && state.karma >= 25) print("【真结局：琴箫合奏·笑傲江湖】");
        else print("【武林盟主/一代枭雄结局】");
        renderActions([{ text: "再入江湖", cmd: "重开", action: () => resetGame() }]);
    }

    function goScene(key) {
        state.scene = key; updateUI();
        const sc = SCENES[key];
        if (sc) { sc.enter(); if (sc.options) renderActions(sc.options); }
    }

    let currentOptions = [];
    function renderActions(opts) {
        currentOptions = opts;
        actionsEl.innerHTML = '';
        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'action-chip';
            btn.innerText = opt.text;
            btn.onclick = (e) => {
                if(e) e.preventDefault();
                print(`> ${opt.text}`, 'user');
                opt.action();
            };
            actionsEl.appendChild(btn);
        });
    }

    function handleInput() {
        const raw = inputEl.value.trim();
        if (!raw) return;
        inputEl.value = '';
        print(`> ${raw}`, 'user');

        if (raw.includes("状态") || raw.includes("档案")) { showStatus(); return; }
        if (raw.includes("存档")) { manualSave(); return; }
        if (raw.includes("重开")) { resetGame(); return; }

        let matched = currentOptions.find((opt, idx) => raw === String(idx + 1) || (opt.cmd && raw.includes(opt.cmd)) || opt.text.includes(raw));
        if (matched) matched.action();
        else print("【提示】无效指令，请点击选项或输入数字。", "system");
    }

    function showStatus() {
        const modal = document.getElementById('modal');
        document.getElementById('modal-body').innerHTML = `
            <h3>📜 侠客江湖档案</h3>
            <p><strong>当前侠客：</strong>${currentUser}</p>
            <p><strong>门派：</strong>${state.sect}</p>
            <p><strong>天数：</strong>第 ${state.day} 天</p>
            <p><strong>善恶：</strong>${state.karma}</p>
            <p><strong>武学：</strong>${state.skills.join("、")}</p>
            <p><strong>行囊：</strong>${state.items.join("、") || "空"}</p>
            <button class="close-modal" onclick="document.getElementById('modal').style.display='none'">关闭</button>
        `;
        modal.style.display = 'flex';
    }

    function resetGame() {
        state = getDefaultState();
        logEl.innerHTML = '';
        goScene("intro");
    }
</script>
</body>
</html>
