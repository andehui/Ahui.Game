<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>荒野求生 - 王者操作盘与战狼进化版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        /* 登录/注册浮层 */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        #login-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .login-card {
            background: #1e1e1e;
            padding: 30px 40px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            text-align: center;
            width: 90%;
            max-width: 380px;
        }
        .login-card h1 {
            color: #2196F3;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            font-size: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-input:focus {
            border-color: #2196F3;
        }
        .register-btn {
            background: #2196F3;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }
        .register-btn:hover {
            background: #1e88e5;
            transform: scale(1.02);
        }

        /* 游戏整体布局：手机端自适应 */
        #game-wrapper {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: #121212;
        }
        #game-wrapper.active {
            display: flex;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            max-height: 100vh;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* UI 面板 */
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 12px;
            border-radius: 6px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 12px;
            min-width: 180px;
            z-index: 5;
        }
        .ui-panel h1 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #2196F3;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ui-panel p {
            margin: 2px 0;
            color: #ddd;
        }
        .timer-highlight { color: #ffca28; font-weight: bold; }
        .kills-highlight { color: #ff5252; font-weight: bold; }
        .level-highlight { color: #e040fb; font-weight: bold; }

        /* 经验条 */
        .exp-bar-box {
            width: 100%;
            background: #333;
            height: 6px;
            border-radius: 3px;
            margin: 4px 0;
            overflow: hidden;
            border: 1px solid #555;
        }
        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00e676, #00b0ff);
            width: 0%;
        }
        .buff-container {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 10px;
        }
        .buff-tag {
            display: block;
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            color: #64b5f6;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
        }

        /* 暂停按钮样式 */
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            backdrop-filter: blur(4px);
        }
        #pause-btn:active {
            background: #2196F3;
        }

        /* 提示信息弹窗 (如护卫阵亡提示) */
        #notification-toast {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #notification-toast.show {
            opacity: 1;
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 10px;
            color: #aaa;
            pointer-events: none;
            display: none; /* 手机/PC通用，可通过媒体查询或自适应显示 */
        }

        /* 王者荣耀左侧虚拟摇杆样式 */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            display: none; /* 运行时按需开启 */
            z-index: 5;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(33, 150, 243, 0.5);
            border: 2px solid #2196F3;
            border-radius: 50%;
            pointer-events: none;
        }

        /* 右侧攻击按钮 (手机端备用，PC端可点或按空格) */
        #attack-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 85px;
            height: 85px;
            background: rgba(255, 82, 82, 0.3);
            border: 2px solid #ff5252;
            border-radius: 50%;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        #attack-btn:active {
            background: rgba(255, 82, 82, 0.7);
            transform: scale(0.95);
        }

        /* 暂停浮层 / 游戏结束浮层通用样式 */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .overlay-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay-screen h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }
        .overlay-screen p {
            font-size: 14px;
            margin-bottom: 6px;
            color: #eee;
        }
        .overlay-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .overlay-btn:hover { background: #1e88e5; }

        /* 右侧战绩排行榜 (大屏显示) */
        #leaderboard {
            width: 250px;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 550px;
            display: flex;
            flex-direction: column;
        }
        #leaderboard h2 {
            font-size: 14px;
            color: #2196F3;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #444;
            text-align: center;
        }
        .score-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }
        .score-item {
            display: flex;
            flex-direction: column;
            padding: 6px;
            font-size: 11px;
            border-bottom: 1px solid #333;
            color: #ccc;
        }
        .score-item:nth-child(even) { background: rgba(255,255,255,0.03); }
        .score-row-top { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .score-row-bottom { display: flex; justify-content: space-between; color: #888; font-size: 10px; }
        .score-item .index { color: #ffca28; font-weight: bold; }
        .score-item .time { color: #4fc3f7; font-weight: bold; }
        .score-item .kills { color: #ff5252; font-weight: bold; }
        .no-records { text-align: center; color: #666; font-size: 11px; padding: 15px 0; }

        /* 响应式媒体查询：移动端竖屏/小屏自动缩放隐藏侧边榜单 */
        @media (max-width: 900px) {
            #game-wrapper {
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 5px;
                gap: 5px;
            }
            #leaderboard {
                display: none; /* 手机端隐藏排行榜以留出游戏画面 */
            }
            #game-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                border: none;
            }
            #joystick-base, #attack-btn {
                display: block; /* 移动端显示虚拟摇杆和攻击按钮 */
            }
            .controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- 用户登录浮层 -->
<div id="login-overlay">
    <div class="login-card">
        <h1 id="registerTitle">荒野求生</h1>
        <p>输入昵称，开启王者转盘与战狼护卫之旅</p>
        <input type="text" id="usernameInput" class="login-input" placeholder="输入您的昵称 (例如: 拳王阿强)" maxlength="16">
        <button class="register-btn" onclick="registerUser()">开始游戏</button>
    </div>
</div>

<!-- 游戏主体 -->
<div id="game-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <button id="pause-btn" onclick="togglePause()" title="暂停 (Esc)">⏸️</button>

        <div id="notification-toast">护卫战狼阵亡！</div>

        <div class="ui-panel">
            <h1 id="gameTitle">🥊 荒野求生</h1>
            <p>玩家: <span id="userNameDisplay" style="color:#00e5ff; font-weight:bold;">玩家</span></p>
            <p>当前在线: <span id="onlineCount" style="color:#00e676; font-weight:bold;">1</span> 人</p>
            <p>历史玩过: <span id="totalPlayersCount" style="color:#ffca28; font-weight:bold;">128</span> 人</p>
            <p>等级: <span id="playerLevel" class="level-highlight">Lv.1</span> (Max 99)</p>
            <div class="exp-bar-box">
                <div class="exp-bar-fill" id="expBarFill"></div>
            </div>
            <p>生存: <span id="survivalTime" class="timer-highlight">0.0</span>s | 击杀: <span id="killCount" class="kills-highlight">0</span></p>
            <div class="buff-container" id="buffContainer">
                <span style="color:#aaa;">道具状态: 无 (有效30秒)</span>
            </div>
        </div>

        <div class="controls-hint">
            移动: 方向键/WASD | 攻击: [空格键] | 暂停: [Esc]
        </div>

        <!-- 王者荣耀左侧转盘控件 -->
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <!-- 右侧攻击按钮（手机端） -->
        <div id="attack-btn">普攻/发射</div>

        <!-- 暂停浮层 -->
        <div id="pause-overlay" class="overlay-screen">
            <h2 style="color: #ffca28;">游戏已暂停</h2>
            <p>按 [Esc] 键或点击下方按钮继续游戏</p>
            <button class="overlay-btn" onclick="togglePause()">继续游戏</button>
        </div>

        <!-- 游戏结束浮层 -->
        <div id="game-over-overlay" class="overlay-screen">
            <h2 style="color: #f44336;">K.O.! 拳王力尽</h2>
            <p>被妖怪击败了！</p>
            <p>最终等级: <span id="finalLevel" class="level-highlight">Lv.1</span></p>
            <p>生存时间: <span id="finalTime" class="timer-highlight">0.0</span> 秒</p>
            <p>击杀妖怪: <span id="finalKills" class="kills-highlight">0</span> 只</p>
            <button class="overlay-btn" onclick="resetGame()">再战一局</button>
        </div>
    </div>

    <!-- 战绩表 -->
    <div id="leaderboard">
        <h2>最近10次战绩表</h2>
        <ul class="score-list" id="scoreList">
            <li class="no-records">⚠️ 暂无战绩记录</li>
        </ul>
    </div>
</div>

<script>
// --- Web Audio API 8bit 复古音效 & 背景音乐 ---
let audioCtx = null;
let bgmInterval = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    startBGM();
}

function startBGM() {
    if (bgmInterval) return;
    let notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
    let step = 0;
    bgmInterval = setInterval(() => {
        if (!audioCtx || audioCtx.state !== 'running' || isPaused || isGameOver) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
            step++;
        } catch(e) {}
    }, 320);
}

function playSoundShoot() {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

function playSoundHit() {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.2);
    } catch(e) {}
}

function playSoundPowerup() {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.12, now + idx * 0.07);
            gain.gain.linearRampToValueAtTime(0.01, now + (idx + 1) * 0.07);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + (idx + 1) * 0.07);
        });
    } catch(e) {}
}

function playSoundLevelUp() {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.14, now + idx * 0.08);
            gain.gain.linearRampToValueAtTime(0.01, now + (idx + 1) * 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + (idx + 1) * 0.08);
        });
    } catch(e) {}
}

function playSoundGameOver() {
    if (!audioCtx) return;
    try {
        let now = audioCtx.currentTime;
        let freqs = [400, 350, 300, 220];
        freqs.forEach((freq, idx) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.15, now + idx * 0.12);
            gain.gain.linearRampToValueAtTime(0.01, now + (idx + 1) * 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + (idx + 1) * 0.12);
        });
    } catch(e) {}
}

// --- 真正精准的在线人数（当前正在使用该页面的用户）与历史总游玩人数统计 ---
let activeUsersCount = 1;
let totalPlayersCount = 1;

try {
    let storedTotal = localStorage.getItem('survival_game_total_players');
    let hasCountedThisDevice = sessionStorage.getItem('survival_game_counted');
    
    if (!storedTotal) {
        totalPlayersCount = 128; // 基础初始基数
        localStorage.setItem('survival_game_total_players', totalPlayersCount);
    } else {
        totalPlayersCount = parseInt(storedTotal, 10);
    }

    if (!hasCountedThisDevice) {
        totalPlayersCount += 1;
        localStorage.setItem('survival_game_total_players', totalPlayersCount);
        sessionStorage.setItem('survival_game_counted', 'true');
    }
} catch(e) {
    totalPlayersCount = 1;
}

// 跨标签页/当前浏览器活跃在线人数实时统计 (BroadcastChannel + Visibility API)
const pageSessionId = Math.random().toString(36).substring(2, 15);
let activeTabChannel = null;

try {
    activeTabChannel = new BroadcastChannel('survival_game_active_users_v2');
    let peers = {};
    peers[pageSessionId] = Date.now();

    activeTabChannel.onmessage = (event) => {
        if (event.data && event.data.id && event.data.type === 'ping') {
            peers[event.data.id] = Date.now();
            activeTabChannel.postMessage({ id: pageSessionId, type: 'pong' });
        } else if (event.data && event.data.id && event.data.type === 'pong') {
            peers[event.data.id] = Date.now();
        }
    };

    function broadcastPresence() {
        if (document.visibilityState === 'visible') {
            peers[pageSessionId] = Date.now();
            if (activeTabChannel) {
                activeTabChannel.postMessage({ id: pageSessionId, type: 'ping' });
            }
        }
    }

    broadcastPresence();
    setInterval(broadcastPresence, 2000);

    // 清理过期心跳 (超过6秒无响应视为离开)
    setInterval(() => {
        let now = Date.now();
        let count = 0;
        for (let id in peers) {
            if (now - peers[id] > 6000) {
                delete peers[id];
            } else {
                count++;
            }
        }
        activeUsersCount = Math.max(1, count);
        
        let onlineEl = document.getElementById('onlineCount');
        if (onlineEl) onlineEl.textContent = activeUsersCount;

        let totalEl = document.getElementById('totalPlayersCount');
        if (totalEl) totalEl.textContent = totalPlayersCount;
    }, 2000);

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            broadcastPresence();
        }
    });
} catch (e) {
    let onlineEl = document.getElementById('onlineCount');
    if (onlineEl) onlineEl.textContent = "1";
    let totalEl = document.getElementById('totalPlayersCount');
    if (totalEl) totalEl.textContent = totalPlayersCount;
}

window.addEventListener('DOMContentLoaded', () => {
    let onlineEl = document.getElementById('onlineCount');
    if (onlineEl) onlineEl.textContent = activeUsersCount;
    let totalEl = document.getElementById('totalPlayersCount');
    if (totalEl) totalEl.textContent = totalPlayersCount;
});

// --- 提示弹窗函数 ---
function showNotification(msg) {
    let toast = document.getElementById('notification-toast');
    toast.textContent = msg;
    toast.classList.add('show');

// --- Perlin Noise 地形 ---
const Perlin = {
    p: new Uint8Array(512),
    init: function() {
        let permutation = new Uint8Array(256);
        for (let i = 0; i < 256; i++) permutation[i] = i;
        for (let i = 255; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [permutation[i], permutation[j]] = [permutation[j], permutation[i]];
        }
        for (let i = 0; i < 512; i++) this.p[i] = permutation[i & 255];
    },
    fade: t => t * t * t * (t * (t * 6 - 15) + 10),
    lerp: (t, a, b) => a + t * (b - a),
    grad: (hash, x, y) => {
        let h = hash & 7;
        let u = h < 4 ? x : y;
        let v = h < 4 ? y : x;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    },
    noise: function(x, y) {
        let X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
        x -= Math.floor(x); y -= Math.floor(y);
        let u = this.fade(x), v = this.fade(y);
        let A = this.p[X] + Y, B = this.p[X + 1] + Y;
        return this.lerp(v, 
            this.lerp(u, this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y)),
            this.lerp(u, this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1))
        );
    }
};
Perlin.init();

    joystickState.active = true;
    joystickState.startX = e.clientX;
    joystickState.startY = e.clientY;
    joystickState.currentX = e.clientX;
    joystickState.currentY = e.clientY;
    joystickBase.setPointerCapture(e.pointerId);
});

joystickBase.addEventListener('pointermove', e => {
    if (!joystickState.active) return;
    joystickState.currentX = e.clientX;
    joystickState.currentY = e.clientY;

    let dx = joystickState.currentX - joystickState.startX;
    let dy = joystickState.currentY - joystickState.startY;
    let dist = Math.hypot(dx, dy);
    let maxDist = 45; // 摇杆最大活动半径

    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }

    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

    let normDist = Math.min(1.0, dist / maxDist);
    joystickState.vectorX = (dx / maxDist) * normDist;
    joystickState.vectorY = (dy / maxDist) * normDist;
});

function resetJoystick() {
    joystickState.active = false;
    joystickState.vectorX = 0;

function getTerrain(wx, wy) {
    let scale = 0.04;
    let val = Perlin.noise(wx * scale, wy * scale) * 1.0 +
              Perlin.noise(wx * scale * 2, wy * scale * 2) * 0.5 +
              Perlin.noise(wx * scale * 4, wy * scale * 4) * 0.25;
    val = (val + 1) / 2;
    val = Math.max(0, Math.min(1, val));

    if (val < 0.3) return TERRAINS[0];
    if (val < 0.4) return TERRAINS[1];
    if (val < 0.45) return TERRAINS[2];
    if (val < 0.65) return TERRAINS[3];
    if (val < 0.8) return TERRAINS[4];
    if (val < 0.9) return TERRAINS[5];
    return TERRAINS[6];
}

function getObjectAt(wx, wy, terrainName) {
    let hash = Math.sin(wx * 12.9898 + wy * 78.233) * 43758.5453;
    hash = hash - Math.floor(hash);
    if (terrainName === '森林' && hash > 0.45) return 'tree';
    if (terrainName === '草地' && hash > 0.88) return 'flower';
    if (terrainName === '山地' && hash > 0.75) return 'rock';
    return null;
}

function addExp(amount) {
    if (player.level >= 99) return;
    player.exp += amount;
    
    let needed = player.maxExp;
    while (player.exp >= needed && player.level < 99) {
        player.exp -= needed;
        player.level++;
        player.bulletDamage += 1;
        player.maxExp = Math.floor(player.maxExp * 1.35);
        playSoundLevelUp();
        addFloatingText(`⭐ 升级啦！当前 Lv.${player.level}！属性大幅提升！`, player.x, player.y - 1.5, "#00e5ff");
    }
    updateUI();
}

function shootBullet() {
    if (isGameOver || isPaused) return;
    let now = performance.now();
    let baseCooldown = Math.max(200, 1000 - (player.level - 1) * 10);
    let cooldown = player.buffs.rapid.active ? baseCooldown * 0.4 : baseCooldown;

    if (now - lastShootTime < cooldown) return;
    lastShootTime = now;

    playSoundShoot();

    let target = getClosestMonster(player.x, player.y);
    let baseVx = player.facingX || 0;
    let baseVy = player.facingY || -1;

    if (target) {
        let dx = target.x - player.x;
        let dy = target.y - player.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 0) {
            baseVx = dx / dist;
            baseVy = dy / dist;
        }
    }

    let angles = [0];
    if (player.buffs.multishot.active) angles = [-0.25, 0, 0.25];

    angles.forEach(ang => {
        let cos = Math.cos(ang), sin = Math.sin(ang);
        let vx = baseVx * cos - baseVy * sin;
        let vy = baseVx * sin + baseVy * cos;

        bullets.push({
            x: player.x,
            y: player.y,
            vx, vy,
            speed: player.baseSpeed * 2.6,
            damage: player.bulletDamage,
            targetId: target ? target.id : null,
            life: 4.5
        });
    });
}

function getClosestMonster(x, y) {
    let closest = null;
    let minDist = Infinity;
    monsters.forEach(m => {
        let dist = Math.hypot(m.x - x, m.y - y);
        if (dist < minDist) { minDist = dist; closest = m; }
    });
    return closest;
}

function updateGame(deltaTime) {
    if (isGameOver || isPaused) return;

    let deltaSec = deltaTime / 1000;
    survivalTime += deltaSec;

    for (let key in player.buffs) {
        let b = player.buffs[key];
        if (b.active) {
            b.timeLeft -= deltaSec;
            if (b.timeLeft <= 0) {
                b.active = false;
                addFloatingText(`⌛ [${key}] 道具效果已失效`, player.x, player.y - 1, '#aaa');
            }
        }
    }

    if (survivalTime - lastItemSpawnTime > 14) {
        lastItemSpawnTime = survivalTime;
        spawnItem();
    }

    if (keys[' ']) shootBullet();

    let maxMonsters = Math.min(18, 4 + Math.floor(player.level * 0.8) + Math.floor(survivalTime / 25));
    if (monsters.length < maxMonsters) {
        spawnMonster(false);
    }

    let currentGridX = Math.floor(player.x);
    let currentGridY = Math.floor(player.y);
    let currentTerrain = getTerrain(currentGridX, currentGridY);

    let speedBuffMultiplier = player.buffs.speed.active ? 1.35 : 1.0;
    let levelSpeedBonus = 1 + (player.level - 1) * 0.02;
    let currentSpeed = player.baseSpeed * levelSpeedBonus * speedBuffMultiplier * currentTerrain.speedMultiplier * deltaSec;

    let moveX = 0, moveY = 0;

    // 键盘移动
    if (keys['ArrowUp'] || keys['w'] || keys['W']) moveY -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) moveY += 1;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) moveX -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) moveX += 1;

    // 王者荣耀转盘摇杆移动叠加
    if (joystickState.active && (joystickState.vectorX !== 0 || joystickState.vectorY !== 0)) {
        moveX = joystickState.vectorX;
        moveY = joystickState.vectorY;
    }

    if (moveX !== 0 && moveY !== 0 && (keys['ArrowUp'] || keys['w'] || keys['W'] || keys['ArrowDown'] || keys['s'] || keys['S'] || keys['ArrowLeft'] || keys['a'] || keys['A'])) {
        moveX *= 0.7071; moveY *= 0.7071;
    }

    if (moveX !== 0 || moveY !== 0) {
        player.isMoving = true;
        player.facingX = moveX;
        player.facingY = moveY;
        player.runCycle += deltaTime * 0.015;
    } else {
        player.isMoving = false;
        player.runCycle = 0;
    }

    player.x += moveX * currentSpeed;
    player.y += moveY * currentSpeed;

    // --- 护卫狼 AI ---
    if (wolf) {
        wolf.level = player.level;
        let targetMonster = getClosestMonster(wolf.x, wolf.y);
        let wolfSpeed = 4.2 * deltaSec;

        if (targetMonster && Math.hypot(targetMonster.x - wolf.x, targetMonster.y - wolf.y) < 7) {
            let wdx = targetMonster.x - wolf.x;
            let wdy = targetMonster.y - wolf.y;
            let wdist = Math.hypot(wdx, wdy);
            if (wdist > 0) {
                wolf.x += (wdx / wdist) * wolfSpeed;
                wolf.y += (wdy / wdist) * wolfSpeed;
            }

            if (wdist < 0.9 && performance.now() - wolf.lastAttackTime > 800) {
                wolf.lastAttackTime = performance.now();
                let isUlt = Math.random() < 0.25;
                let dmg = isUlt ? player.bulletDamage * 3 : player.bulletDamage;
                targetMonster.hp -= dmg;

                if (isUlt) {
                    addFloatingText(`🐺 战狼【狂野烈牙绝息斩】! -${dmg}`, targetMonster.x, targetMonster.y - 1, "#ff9100");
                } else {
                    addFloatingText(`🐺 战狼扑击 -${dmg}`, targetMonster.x, targetMonster.y, "#ff7043");
                }

                if (targetMonster.hp <= 0) {
                    playSoundHit();
                    addFloatingText(targetMonster.isBoss ? "👑 战狼助攻BOSS击破!" : "K.O.!", targetMonster.x, targetMonster.y, "#ffca28");
                    let mIndex = monsters.findIndex(m => m.id === targetMonster.id);
                    if (mIndex !== -1) monsters.splice(mIndex, 1);
                    killCount++;
                    addExp(targetMonster.exp);

                    if (killCount % 100 === 0) {
                        spawnMonster(true);
                    }
                    updateUI();
                }
            }
        } else {
            let pdist = Math.hypot(player.x - wolf.x, player.y - wolf.y);
            if (pdist > 1.8) {
                let pdx = player.x - wolf.x;
                let pdy = player.y - wolf.y;
                wolf.x += (pdx / pdist) * wolfSpeed;
                wolf.y += (pdy / pdist) * wolfSpeed;
            }
        }

        // 护卫狼阵亡机制与提示
        let attackersCount = monsters.filter(m => Math.hypot(m.x - wolf.x, m.y - wolf.y) < 1.0).length;
        if (attackersCount >= 2) {
            showNotification("💀 警告：战狼护卫遭到多只怪物围攻牺牲了！");
            playSoundGameOver();
            wolf = null;
            updateUI();
        }
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.life -= deltaSec;
        if (it.life <= 0) { items.splice(i, 1); continue; }
        if (Math.hypot(it.x - player.x, it.y - player.y) < 0.9) {
            if (it.type === 'wolf') {
                wolf = {
                    x: player.x + 1,
                    y: player.y + 1,
                    level: player.level,
                    lastAttackTime: 0
                };
                playSoundPowerup();
                showNotification("🐺 成功召唤【战狼护卫】！永久跟随帮你战斗！");
                addFloatingText(`🐺 召唤战狼护卫成功！`, player.x, player.y - 1, "#ff5722");
            } else {
                player.buffs[it.type].active = true;
                player.buffs[it.type].timeLeft = 30.0;
                playSoundPowerup();
                addFloatingText(`✨ 获得 30 秒强力buff: ${it.name}!`, player.x, player.y - 1, it.color);
            }
            items.splice(i, 1);
            updateUI();
        }
    }

    monsters.forEach(m => {
        let dx = player.x - m.x, dy = player.y - m.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 0) {
            let mTerrain = getTerrain(Math.floor(m.x), Math.floor(m.y));
            let mSpeed = m.speed * mTerrain.speedMultiplier * deltaSec;
            m.x += (dx / dist) * mSpeed;
            m.y += (dy / dist) * mSpeed;
        }
        if (dist < 0.75) {
            if (player.buffs.shield.active) {
                player.buffs.shield.active = false;
                playSoundPowerup();
                addFloatingText("🛡️ 金钟护体抵挡了一次致命攻击！", player.x, player.y - 1, "#ffd700");
                m.x -= (dx / dist) * 4; m.y -= (dy / dist) * 4;
                updateUI();
            } else {
                triggerGameOver();
            }
        }
    });

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.life -= deltaSec;
        if (b.life <= 0) { bullets.splice(i, 1); continue; }

        let target = monsters.find(m => m.id === b.targetId);
        if (!target) { target = getClosestMonster(b.x, b.y); if (target) b.targetId = target.id; }

        if (target) {
            let tdx = target.x - b.x, tdy = target.y - b.y;
            let tDist = Math.hypot(tdx, tdy);
            if (tDist > 0) {
                b.vx = b.vx * 0.82 + (tdx / tDist) * 0.18;
                b.vy = b.vy * 0.82 + (tdy / tDist) * 0.18;
                let vLen = Math.hypot(b.vx, b.vy);
                b.vx /= vLen; b.vy /= vLen;
            }
        }

        b.x += b.vx * b.speed * deltaSec;
        b.y += b.vy * b.speed * deltaSec;

        let hitIndex = -1;
        for (let j = 0; j < monsters.length; j++) {
            if (Math.hypot(monsters[j].x - b.x, monsters[j].y - b.y) < 0.7) { hitIndex = j; break; }
        }

        if (hitIndex !== -1) {
            let m = monsters[hitIndex];
            m.hp -= b.damage;
            bullets.splice(i, 1);

            if (m.hp <= 0) {
                playSoundHit();
                addFloatingText(m.isBoss ? "👑 BOSS 击破!" : "K.O.!", m.x, m.y, m.isBoss ? "#ffca28" : "#ff1744");
                monsters.splice(hitIndex, 1);
                killCount++;
                addExp(m.exp);

                if (killCount % 100 === 0) {
                    spawnMonster(true);
                }

                updateUI();
            } else {
                addFloatingText(`-${b.damage}`, m.x, m.y, "#fff");
            }
        }
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.life -= deltaSec * 1.2;
        ft.y += ft.vy * deltaSec;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

function triggerGameOver() {
    isGameOver = true;
    playSoundGameOver();
    document.getElementById('finalLevel').textContent = `Lv.${player.level}`;
    document.getElementById('finalTime').textContent = survivalTime.toFixed(1);
    document.getElementById('finalKills').textContent = killCount;
    document.getElementById('game-over-overlay').classList.add('active');
    addRecord(survivalTime, killCount, player.level);
}

function drawBoxerHero(cx, cy, p) {
    let runAngle = p.isMoving ? Math.sin(p.runCycle) * 0.6 : 0;
    let bounce = p.isMoving ? Math.abs(Math.sin(p.runCycle * 2)) * 3 : Math.sin(performance.now() * 0.003) * 1.5;

    ctx.save();
    ctx.translate(cx, cy - bounce);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 24 + bounce, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    if (p.buffs.shield.active) {
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(0, -10, 28, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;
    }

    ctx.fillStyle = '#c68642';
    ctx.save(); ctx.translate(-5, 8); ctx.rotate(-runAngle);
    ctx.beginPath(); ctx.roundRect(-3.5, 0, 7, 16, 3); ctx.fill(); ctx.restore();

    ctx.save(); ctx.translate(5, 8); ctx.rotate(runAngle);
    ctx.beginPath(); ctx.roundRect(-3.5, 0, 7, 16, 3); ctx.fill(); ctx.restore();

    ctx.fillStyle = '#0277bd';
    ctx.beginPath(); ctx.roundRect(-12, -2, 24, 12, [2, 2, 4, 4]); ctx.fill();
    ctx.fillStyle = '#111'; ctx.fillRect(-12, -2, 24, 4);

    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-9, 3); ctx.lineTo(-6, 7); ctx.lineTo(-8, 7); ctx.lineTo(-5, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, 3); ctx.lineTo(6, 7); ctx.lineTo(8, 7); ctx.lineTo(5, 10); ctx.stroke();

    ctx.fillStyle = '#d89351';
    ctx.beginPath(); ctx.roundRect(-13, -22, 26, 21, [6, 6, 2, 2]); ctx.fill();

    ctx.save(); ctx.translate(-14, -18); ctx.rotate(runAngle * 1.2);
    ctx.fillStyle = '#c68642'; ctx.beginPath(); ctx.roundRect(-3, 0, 6, 13, 3); ctx.fill();
    ctx.fillStyle = '#00bcd4'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, 13, 6, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.restore();

    ctx.save(); ctx.translate(14, -18); ctx.rotate(-runAngle * 1.2);
    ctx.fillStyle = '#c68642'; ctx.beginPath(); ctx.roundRect(-3, 0, 6, 13, 3); ctx.fill();
    ctx.fillStyle = '#00bcd4'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, 13, 6, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.restore();

    ctx.fillStyle = '#d89351';
    ctx.beginPath(); ctx.arc(0, -30, 11, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1e1b18';
    ctx.beginPath(); ctx.moveTo(-6, -37); ctx.quadraticCurveTo(0, -44, 6, -37); ctx.lineTo(4, -30); ctx.lineTo(-4, -30); ctx.closePath(); ctx.fill();

    ctx.restore();
}

function drawWolf(w, offsetX, offsetY) {
    let wx = w.x * TILE_SIZE + offsetX;
    let wy = w.y * TILE_SIZE + offsetY;

    ctx.save();
    ctx.translate(wx, wy);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 10, 12, 4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#ff7043';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -4, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -10); ctx.lineTo(6, -14); ctx.lineTo(10, -11); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ffca28';
    ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`🐺Lv.${w.level}`, 0, -18);

    ctx.restore();
}

function renderGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let offsetX = (canvas.width / 2) - (player.x * TILE_SIZE);
    let offsetY = (canvas.height / 2) - (player.y * TILE_SIZE);

    let startX = Math.floor(player.x - VIEW_WIDTH / 2) - 1;
    let endX = Math.ceil(player.x + VIEW_WIDTH / 2) + 1;
    let startY = Math.floor(player.y - VIEW_HEIGHT / 2) - 1;
    let endY = Math.ceil(player.y + VIEW_HEIGHT / 2) + 1;

    for (let x = startX; x < endX; x++) {
        for (let y = startY; y < endY; y++) {
            let terrain = getTerrain(x, y);
            let drawX = x * TILE_SIZE + offsetX;
            let drawY = y * TILE_SIZE + offsetY;

            ctx.fillStyle = terrain.color;
            ctx.fillRect(Math.floor(drawX), Math.floor(drawY), TILE_SIZE + 1, TILE_SIZE + 1);

            let obj = getObjectAt(x, y, terrain.name);
            if (obj === 'tree') {
                ctx.fillStyle = '#0f380f';
                ctx.beginPath(); ctx.arc(drawX + TILE_SIZE/2, drawY + TILE_SIZE/2, TILE_SIZE/2 - 2, 0, Math.PI * 2); ctx.fill();
            } else if (obj === 'rock') {
                ctx.fillStyle = '#495057';
                ctx.beginPath(); ctx.arc(drawX + TILE_SIZE/2, drawY + TILE_SIZE/2, TILE_SIZE/4, 0, Math.PI * 2); ctx.fill();
            } else if (obj === 'flower') {
                ctx.fillStyle = '#ffb703'; ctx.fillRect(drawX + TILE_SIZE/2 - 2, drawY + TILE_SIZE/2 - 2, 4, 4);
            }
        }
    }

    items.forEach(it => {
        let itDrawX = it.x * TILE_SIZE + offsetX;
        let itDrawY = it.y * TILE_SIZE + offsetY;
        let pulse = Math.sin(performance.now() * 0.005) * 3;

        ctx.fillStyle = it.color; ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.arc(itDrawX, itDrawY, 14 + pulse, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.beginPath(); ctx.arc(itDrawX, itDrawY, 10, 0, Math.PI * 2); ctx.fill();
        ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(it.icon, itDrawX, itDrawY);
    });

    bullets.forEach(b => {
        let bDrawX = b.x * TILE_SIZE + offsetX;
        let bDrawY = b.y * TILE_SIZE + offsetY;
        ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#e0f7fa';
        ctx.beginPath(); ctx.arc(bDrawX, bDrawY, 5 + Math.min(3, b.damage * 0.5), 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    });

    monsters.forEach(m => {
        let mDrawX = m.x * TILE_SIZE + offsetX;
        let mDrawY = m.y * TILE_SIZE + offsetY;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath(); ctx.ellipse(mDrawX, mDrawY + 8, m.size * 0.5, m.size * 0.25, 0, 0, Math.PI * 2); ctx.fill();

        if (m.shape === 'blob') {
            ctx.fillStyle = m.color;
            ctx.beginPath(); ctx.arc(mDrawX, mDrawY, m.size / 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(mDrawX - 4, mDrawY - 4, 3, 3);
            ctx.fillRect(mDrawX + 1, mDrawY - 4, 3, 3);
        } else if (m.shape === 'zombie') {
            ctx.fillStyle = m.color;
            ctx.beginPath(); ctx.roundRect(mDrawX - m.size/2, mDrawY - m.size/2, m.size, m.size, 4); ctx.fill();
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(mDrawX - 5, mDrawY - 6, 3, 3);
            ctx.fillRect(mDrawX + 2, mDrawY - 6, 3, 3);
        } else if (m.shape === 'spike') {
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(mDrawX, mDrawY - m.size/2);
            ctx.lineTo(mDrawX + m.size/2, mDrawY + m.size/2);
            ctx.lineTo(mDrawX - m.size/2, mDrawY + m.size/2);
            ctx.closePath();
            ctx.fill();
        } else if (m.shape === 'boss') {
            ctx.fillStyle = m.color;
            ctx.beginPath(); ctx.arc(mDrawX, mDrawY, m.size / 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.stroke();

            let barW = 50;
            let hpPercent = Math.max(0, m.hp / m.maxHp);
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(mDrawX - barW/2, mDrawY - m.size/2 - 12, barW, 6);
            ctx.fillStyle = '#f44336';
            ctx.fillRect(mDrawX - barW/2, mDrawY - m.size/2 - 12, barW * hpPercent, 6);
        }

        if (!m.isBoss && m.maxHp > 1) {
            let barW = 30;
            let hpPercent = Math.max(0, m.hp / m.maxHp);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(mDrawX - barW/2, mDrawY - m.size/2 - 8, barW, 4);
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(mDrawX - barW/2, mDrawY - m.size/2 - 8, barW * hpPercent, 4);
        }
    });

    if (wolf) {
        drawWolf(wolf, offsetX, offsetY);
    }

    drawBoxerHero(canvas.width / 2, canvas.height / 2, player);

    floatingTexts.forEach(ft => {
        let ftDrawX = ft.x * TILE_SIZE + offsetX;
        let ftDrawY = ft.y * TILE_SIZE + offsetY;
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 14px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
        ctx.fillText(ft.text, ftDrawX, ftDrawY);
        ctx.restore();
    });
}

function startGameLoop() {
    resetGame();
    let lastTime = performance.now();
    function loop(now) {
        let deltaTime = now - lastTime;
        lastTime = now;
        updateGame(deltaTime);
        renderGame();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
}
</script>
